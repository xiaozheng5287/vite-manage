给定一个数组 nums，编写一个函数将所有 0 移动到数组的末尾，同时保持非零元素的相对顺序。
请注意 ，必须在不复制数组的情况下原地对数组进行操作。

示例 1:
输入: nums = [0,1,0,3,12]
输出: [1,3,12,0,0]
示例 2:
输入: nums = [0]
输出: [0]
 
提示:
1 <= nums.length <= 104
-231 <= nums[i] <= 231 - 1

进阶：你能尽量减少完成的操作次数吗？

<html lang="en">

<body>
  <script>
    /**
     * 1.双指针：
              快指针：寻找新数组的元素 ，新数组就是不含有目标元素的数组
              慢指针：指向更新 新数组下标的位置
    */
    function moveZeroes(nums) {
      let slowIndex = 0
      let fastIndex = 0
      let length = nums.length
      let count = 0
      // while(fastIndex < nums.length) {
      //   if(nums[fastIndex] !== 0) {
      //     nums[slowIndex] = nums[fastIndex]
      //     slowIndex ++
      //   }
      //   else {
      //     count ++
      //   }
      //   fastIndex++
      // }
      // while(count--){
        
      //   nums[length -1 - (count)] = 0
      // }
      /**
       * 简便方法：交换非0元素与0的位置
       * */
      while(fastIndex < nums.length) {
        if(nums[fastIndex] !== 0) {
          [nums[slowIndex], nums[fastIndex]] = [nums[fastIndex], nums[slowIndex]]
          slowIndex++
        }
        fastIndex++
      }
      return nums
    }
  </script>

给定一个正整数 n，生成一个包含 1 到 n^2 所有元素，
且元素按顺时针顺序螺旋排列的正方形矩阵。 示例: 输入: 3 输出: [ [ 1, 2, 3 ], [ 8,
9, 4 ], [ 7, 6, 5 ] ]

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script>
      /**
       * 螺旋矩阵
       * 循环不变量
       * 左闭右开处理第一个节点
       * -------------》
       * /\           |
       * |            |
       * |            |
       * |            |
       * |            |
       * <------------\/
       * 循环的圈数(奇数/偶数)
       * 终止位置偏移
       */

      function rectangle(num) {
        let startX = startY = 0; //每一圈的起始位置
        let offset = 1; //偏移量，控制每一层填充个数
        let count = 1; //更新填充数字
        let loop = Math.floor(num / 2);
        let mid = Math.floor(num / 2); // 中间位置(防止奇数)
        //创建一个二维数组
        let resultArr = new Array(num)
          .fill(0)
          .map(() => new Array(num).fill(0));
        //循环的圈数
        while (loop--) {
          for (j = startY; j < num - offset; j++) {
            resultArr[startX][j] = count++;
          }
          for (i = startX; i < num - offset; i++) {
            resultArr[i][j] = count++;
          }
          for (; j > startY; j--) {
            resultArr[i][j] = count++;
          }
          for (; i > startX; i--) {
            resultArr[i][j] = count++;
          }
        }
        // 更新起始位置
        startX++;
        startY++;

        // 更新offset
        offset ++;
        // while (loop--) {
        //   let row = startX, col = startY;
        // }
        // 如果n为奇数的话，需要单独给矩阵最中间的位置赋值
        if (num % 2 === 1) {
          resultArr[mid][mid] = count;
        }
        return resultArr;
      }

  <body>
    <script>
      /**
       * 给定一个 n 个元素有序的（升序）整型数组 nums 和一个目标值 target ，
       * 写一个函数搜索 nums 中的 target，如果目标值存在返回下标，否则返回 -1。
       * 你可以假设 nums 中的所有元素是不重复的。
          n 将在 [1, 10000]之间。
          nums 的每个元素都将在 [-9999, 9999]之间。
          示例 1:
            输入: nums = [-1,0,3,5,9,12], target = 9
            输出: 4
            解释: 9 出现在 nums 中并且下标为 4
          示例 2:
            输入: nums = [-1,0,3,5,9,12], target = 2
            输出: -1
            解释: 2 不存在 nums 中因此返回 -1
      */
      //二分查找(左闭右闭)
      let target = 9;
      let nums = [-1, 0, 3, 5, 9, 12, 17, 29];
      // function query(target, nums) {
      //   let left = 0
      //   let right = nums.length - 1;
      //   let middle
      //   // 位运算 + 防止大数溢出
      //   // middle = left + ((right - left) >> 1);
      //   while(left <= right) {
      //     middle = Math.ceil((left + right)/2);
      //     // debugger
      //     if(nums[middle] > target) {
      //       right = middle - 1
      //     }
      //     else if(nums[middle] < target) {
      //       left = middle + 1
      //     }
      //     else{
      //       return middle
      //     }
      //   }
      //   return -1
      // }
      // console.log(query(target, nums))
      function queryOpen(target, nums) {
        let left = 0;
        let right = nums.length;
        let middle;
        while (left < right) {
          // console.log(left, right);
          middle = left + Math.round((right - left) / 2);
          // - 这行代码用于计算二分查找中的中间索引 `middle`。
          // - `left` 和 `right` 分别表示当前搜索范围的左边界和右边界。
          // - 使用 `(right - left) >> 1` 而不是 `(right + left) / 2` 是为了避免在 `right` 和 `left` 都非常大时发生整数溢出。
          // - `>> 1` 表示将 `(right - left)` 右移一位，相当于除以 2。
          // - 最终 `middle` 的值为 `left` 加上 `(right - left) / 2`，这样可以确保 `middle` 始终在 `left` 和 `right` 之间。
          // middle =  left + ((right - left) >> 1);
          if (nums[middle] > target) {
            right = middle - 1;
          } else if (nums[middle] < target) {
            left = middle + 1;
          } else {
            return middle;
          }
        }
        return -1;
      }
      console.log(queryOpen(target, nums));
    </script>

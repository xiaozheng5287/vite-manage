给定一个排序数组和一个目标值，在数组中找到目标值，并返回其索引。
如果目标值不存在于数组中，返回它将会被按顺序插入的位置。
你可以假设数组中无重复元素。
示例 1:
输入: [1,3,5,6], 5
输出: 2
示例 2:
输入: [1,3,5,6], 2
输出: 1
示例 3:
输入: [1,3,5,6], 7
输出: 4
示例 4:
输入: [1,3,5,6], 0
输出: 0

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    /**
     * 四种情况
     * 1. 目标值在数组中
     * 2. 目标值不在数组中，且目标值小于数组中所有元素
     * 3. 目标值不在数组中，且目标值大于数组中所有元素
     * 4. 目标值不在数组中，且目标值介于数组中两个元素之间
    */
    function search(nums, target) {
      let left = 0;
      let right = nums.length - 1;
      let middle
      while(left <= right) {
        middle = Math.ceil((left + right) / 2);
        if(nums[middle] > target) {
          right = middle - 1;
        }
        else if(nums[middle] < target) {
          left = middle + 1;
        }
        else {
          return middle;
        }
      }
      if(left === 0) {
        return left;
      } else if (left > nums.length - 1) {
        return nums.length;
      } else {
        return left;
      }
    }

    console.log(search([1,3,5,6], 5));
  </script>
</body>
</html>

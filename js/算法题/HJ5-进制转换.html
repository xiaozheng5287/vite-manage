## 1. 题目描述 写出一个程序，接受一个十六进制的数，输出该数值的十进制表示。
示例： ``` 输入：0xAA 输出：170 ```

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let str16 = '0xAA'
        let str10 = parseInt(str16, 16)
        console.log(str10)
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!--面向对象-->
  </head>
  <body>
    <script>
      // 构造函数：当做模板
      function Person(name, age, height, weight) {
        this.name = name;
        this.age = age;
        this.height = height;
        this.weight = weight;
        this.speak = function () {
          console.log("我叫" + this.name + "今年" + this.age + "岁");
        };
        this.eat = function () {
          console.log("我吃" + this.weight + "斤饭");
        };
      }
      let obj1 = new Person("张三", 18, 180, 200);
      console.log(obj1);
      let obj2 = new Person("李四", 20, 170, 150);
      console.log(obj2);
      // obj1.speak();
      // obj2.speak();
      // obj1.eat();
      // obj2.eat();

      //new实例化对象时，每个实例都会为构造函数的每个方法开辟一个新的内存空间，有地址指向改方法，造成内存浪费

      //如何解决？将方法存在共用的空间，即原型对象中
      function Person1(name, age, height, weight) {
        this.name = name;
        this.age = age;
        this.height = height;
        this.weight = weight;
      }
      // console.log(Person1);
      //原型对象：就是构造函数(函数)的一个属性，prototype
      //构造函数的prototype指向了一个对象，我们吧这个对象称为原型对象或原型
      //每一个构造函数都有这个属性
      //作用：共享方法，节省内存
      Person1.prototype.speak = function () {
        console.log('123');
      };
      Person1.prototype.eat = function () {
        console.log("我吃" + this.weight + "斤饭");
      };
      let obj3 = new Person1("张三", 18, 180, 200);
      console.log(obj3.speak());
      //----417
      //todo---手写轮播图


    </script>
    </script>
  </body>
</html>

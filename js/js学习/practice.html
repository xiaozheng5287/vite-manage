        //利用递归求n的阶乘 1~n
        function digui(n) {
            if(n === 1) {
                return 1
            }
            else {
                return n * digui(n - 1)//9
            }
        }
        
        console.log(digui(3));

        //求斐波那契数列：兔子序列 1、1、2、3、5、8、13、21、34...
        function rabbit(n) {
            //每个月都要求前一个月和前两个月的和
            if(n == 1 || n == 2) {
                return 1
            }
            return rabbit(n-1) + rabbit(n-2)

            //8
        }
